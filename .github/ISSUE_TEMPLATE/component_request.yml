name: Suggest a component
description: A runtime, tool or app that should be installable from Runtime Forge
labels: [enhancement, new-component]
body:
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "e.g. Notepad++"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is it?
      options: ["Legacy game support", "Runtime", "Developer tool / language", "Everyday app", "Other"]
    validations:
      required: true
  - type: input
    id: winget
    attributes:
      label: winget ID (if it has one)
      description: "`winget search <name>` shows it."
      placeholder: "Notepad++.Notepad++"
  - type: input
    id: download
    attributes:
      label: Official download URL (a direct installer link, or the GitHub releases page)
  - type: textarea
    id: details
    attributes:
      label: Installer details, if you know them
      description: Silent-install switches, whether it's signed (and by whom), where it installs, how to uninstall it.
  - type: textarea
    id: why
    attributes:
      label: Why does it belong here?
